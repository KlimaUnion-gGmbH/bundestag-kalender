name: Bundestag-Kalender aktualisieren

on:
  schedule:
    # Normal (öffentliches Repository, Actions kostenlos). Zeiten in UTC.
    # Montag bis Freitag alle 15 Minuten, versetzt zu den vollen Zeiten (GitHub lässt zu den
    # Spitzenzeiten eher Läufe aus). Das Fenster 7 bis 23 Uhr UTC deckt Sommer- und Winterzeit ab.
    - cron: "7,22,37,52 7-23 * * 1-5"
    # Sicherheitsnetz: an allen Tagen einmal pro Stunde.
    - cron: "23 * * * *"
    # Gedrosselt für ein privates Repository (3.000 Minuten im Team-Plan):
    # die zwei Zeilen darüber auskommentieren, diese zwei aktivieren.
    # - cron: "7,37 7-23 * * 1-5"
    # - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kalender-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Optionaler Versand auf eigenen Webspace (nur aktiv, wenn FTP_HOST als Secret gesetzt ist).
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PFAD: ${{ vars.FTP_PFAD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feeds erzeugen
        env:
          # Optional: eigener DIP-Schlüssel als Repository-Secret DIP_API_KEY.
          # Ohne Secret nutzt das Skript den öffentlichen Schlüssel des Bundestags.
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
          # Optional: Basis-Adresse der Seite als Repository-Variable KALENDER_BASIS_URL,
          # zum Beispiel https://kalender.klimaunion.org (ohne Variable: github.io-Adresse).
          KALENDER_BASIS_URL: ${{ vars.KALENDER_BASIS_URL }}
        run: python 2026-10-12_bundestag_kalender.py

      - name: Änderungen committen
        id: commit
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add docs cache
          if git diff --staged --quiet -- docs; then
            echo "docs_geaendert=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_geaendert=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --staged --quiet; then
            git commit -m "Kalender aktualisiert"
            git push
          fi

      - name: Seite vorbereiten
        if: steps.commit.outputs.docs_geaendert == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        if: steps.commit.outputs.docs_geaendert == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Seite veröffentlichen
        id: deployment
        if: steps.commit.outputs.docs_geaendert == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4

      # Optional und ungetestet: Dateien zusätzlich per FTPS auf eigenen Webspace übertragen.
      # Läuft nur, wenn das Secret FTP_HOST gesetzt ist. Siehe interne Anleitung zum Umzug.
      - name: Auf eigenen Webspace übertragen (optional)
        if: env.FTP_HOST != '' && (steps.commit.outputs.docs_geaendert == 'true' || github.event_name == 'workflow_dispatch')
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; mirror -R docs ${FTP_PFAD:-.}; quit" "$FTP_HOST"
